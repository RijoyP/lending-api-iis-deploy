name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment per branch at a time, and never cancel one that is half way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list package --vulnerable --include-transitive | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages found.'
          }

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Runs the migration scripts against a throw-away database: new database, upgrade
      # with backup, re-run, and an edited script.
      - name: Test database migrations
        shell: powershell
        run: |
          ./deploy/ci/Start-LocalDb.ps1 -InstanceName LendingCi
          ./deploy/ci/Test-DbMigrations.ps1 -Server '(localdb)\LendingCi'

      - name: Publish
        run: dotnet publish src/LendingApi -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o publish

      # The package is built once here. Every environment deploys this same file, together
      # with the deployment scripts and database migrations from the same commit.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "release/LendingApi-${{ steps.version.outputs.version }}.zip"
          Copy-Item -Path deploy -Destination release/deploy -Recurse
          Copy-Item -Path db -Destination release/db -Recurse

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error

  # Promotion: each environment only starts when the one before it succeeded.
  # Pull requests are built and tested but not deployed.
  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      version: ${{ needs.build.outputs.version }}
      test-rollback: true
    secrets: inherit

  deploy-uat:
    needs: [build, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: uat
      version: ${{ needs.build.outputs.version }}
    secrets: inherit

  deploy-preprod:
    needs: [build, deploy-uat]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preprod
      version: ${{ needs.build.outputs.version }}
    secrets: inherit

  # Add required reviewers to the "prod" environment in the repository settings to get a
  # manual approval before this job starts.
  deploy-prod:
    needs: [build, deploy-preprod]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
